[package]
name = "henki"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "A small terminal agent (early development)"
license = "Apache-2.0"
repository = "https://github.com/deorlovnis/henki"
readme = "README.md"
keywords = ["agent", "llm", "terminal", "cli"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1.0.104"
lexopt = "0.3.2"
libc = "0.2"
serde_json = "1"

[lints.rust]
# `unsafe` lives in src/sys.rs alone, which allows it for itself.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Every unsafe block carries a // SAFETY: note.
undocumented_unsafe_blocks = "deny"
# A panic aborts without a result record, so product code never panics on purpose: no unwrap, expect or panic!, and
# no byte-range slicing of a str (str::get instead).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
string_slice = "deny"
# Only main ends the process, and only term writes to stdout and stderr.
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
# The list and the helper to use instead are in clippy.toml.
disallowed_methods = "deny"

# Small and static: check.sh holds the release binary to 1,065,536 bytes.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
